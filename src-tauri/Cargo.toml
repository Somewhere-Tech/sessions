[package]
name = "sessions-app"
version = "0.2.14"
description = "Sessions native client and release package for the local Sessions runtime"
authors = ["Uzair Haq"]
license = "MIT"
repository = "https://github.com/somewhere-tech/sessions"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sessions_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
sha2 = "0.10"
url = "2.5"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
