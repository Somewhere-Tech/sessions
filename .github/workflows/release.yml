name: Release Sessions

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.27
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CI: "true"
  GOFLAGS: -buildvcs=false

jobs:
  build:
    name: Build and test without release authority
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      manifest: ${{ steps.inputs.outputs.manifest }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the tagged source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Resolve the immutable reviewed release source
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$(uname -s)/$(uname -m)" == Darwin/arm64 ]] || { echo 'Apple Silicon macOS host required for the native release build' >&2; exit 1; }
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main
          commit="$(git rev-parse "$tag^{commit}")"
          [[ "$(git rev-parse HEAD)" == "$commit" ]]
          git merge-base --is-ancestor "$commit" origin/main
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          printf 'tag=%s\nversion=%s\ncommit=%s\n' "$tag" "${tag#v}" "$commit" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, 2026-07-21
        with:
          toolchain: stable
      - name: Check release versions and install locked dependencies
        run: |
          node scripts/check-release-version.mjs '${{ steps.source.outputs.version }}'
          npm ci
          npm --prefix frontend ci
          printf 'RELEASE_CARGO_HOME=%s\nRELEASE_RUSTUP_HOME=%s\nRELEASE_GOPATH=%s\nRELEASE_GOCACHE=%s\n' "${CARGO_HOME:-$HOME/.cargo}" "${RUSTUP_HOME:-$HOME/.rustup}" "$(go env GOPATH)" "$(go env GOCACHE)" >> "$GITHUB_ENV"
      - name: Run the complete source gate with isolated state
        env:
          HOME: /tmp/sR/home
          SESSIONS_STATE_DIR: /tmp/sR/runners
          SESSIONS_LEDGER_PATH: /tmp/sR/lanes.sqlite3
          SESSIONS_PORT: "18879"
        run: |
          mkdir -p "$HOME" "$SESSIONS_STATE_DIR"
          export CARGO_HOME="$RELEASE_CARGO_HOME" RUSTUP_HOME="$RELEASE_RUSTUP_HOME" GOPATH="$RELEASE_GOPATH" GOCACHE="$RELEASE_GOCACHE"
          scripts/check-public-tree.sh
          npm run check:structure
          scripts/check-source-size.sh
          node scripts/check-doc-links.mjs
          (cd runtime && go build ./... && go vet ./... && go test -timeout 5m ./...)
          bash runtime/scripts/gen-cli-docs.sh
          git diff --exit-code -- docs/CLI.md
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend run build
          npm --prefix frontend run test:smoke
          npm run test:updater-release
          npm --prefix npm test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the app and platform archives without signing credentials
        env:
          SESSIONS_RUNTIME_SIGN_MODE: adhoc
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/unsigned/cli"
          npm exec tauri build -- --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'
          app=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sessions.app
          for binary in "$app/Contents/MacOS/sessions-app" "$app/Contents/Resources/runtime/sessions" "$app/Contents/Resources/runtime/sessionsd" "$app/Contents/Resources/runtime/sessions-runner"; do
            [[ "$(lipo -archs "$binary")" == arm64 ]] || { echo "Expected Apple Silicon executable: $binary" >&2; exit 1; }
          done
          codesign --verify --deep --strict "$app"
          ditto -c -k --norsrc --noextattr --noqtn --noacl --keepParent "$app" "$RUNNER_TEMP/unsigned/Sessions-unsigned.zip"
          runtime/scripts/release.sh --version "$RELEASE_VERSION" --output-dir "$RUNNER_TEMP/unsigned/cli"
          echo 'Linux ARM64 and AMD64 archives are cross-build evidence here; native operation and reboot acceptance are separate release evidence.' >> "$GITHUB_STEP_SUMMARY"
      - name: Bind the unsigned artifacts to the producing source
        id: inputs
        run: |
          digest="$(node scripts/release-artifacts.mjs record "$RUNNER_TEMP/unsigned" '${{ steps.source.outputs.version }}' '${{ steps.source.outputs.commit }}' unsigned)"
          printf 'manifest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload the exact unsigned build inputs
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-release-${{ steps.source.outputs.commit }}
          path: ${{ runner.temp }}/unsigned/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign and notarize already built artifacts
    needs: build
    runs-on: macos-14
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.inputs.outputs.manifest }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out only the immutable helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}
      - name: Set up Node.js without dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Download only the producing job's unsigned artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/unsigned
          merge-multiple: true
      - name: Verify provenance and stage bounded payloads and signer before credentials exist
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          MANIFEST: ${{ needs.build.outputs.manifest }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$COMMIT" ]]
          node scripts/release-artifacts.mjs verify "$RUNNER_TEMP/unsigned" "$VERSION" "$COMMIT" unsigned "$MANIFEST"
          python3 scripts/unpack-release-app.py "$RUNNER_TEMP/unsigned/Sessions-unsigned.zip" "$RUNNER_TEMP/app-stage"
          node scripts/runtime-signing-manifest.mjs verify "$RUNNER_TEMP/app-stage/Sessions.app/Contents/Resources/runtime" "$VERSION"
          node scripts/unpack-release-cli.cjs "$RUNNER_TEMP/unsigned/cli/sessions_${VERSION}_darwin_arm64.tar.gz" "$RUNNER_TEMP/cli-stage"
          node scripts/stage-updater-signer.mjs "$RUNNER_TEMP/updater-tool"
      - name: Sign, notarize, and verify with step-scoped credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: 7GW9T5ZWW8
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          SESSIONS_UPDATER_PRIVATE_KEY: ${{ secrets.SESSIONS_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          updater_key="$RUNNER_TEMP/updater.key"
          api_key="$RUNNER_TEMP/notarization.p8"
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            python3 -c 'import pathlib,sys; [pathlib.Path(p).unlink(missing_ok=True) for p in sys.argv[1:]]' "$certificate" "$updater_key" "$api_key"
          }
          trap cleanup EXIT
          [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$SESSIONS_UPDATER_PRIVATE_KEY" ]]
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          export SESSIONS_SIGN_IDENTITY='Developer ID Application: Uzair Haq (7GW9T5ZWW8)'
          security find-identity -v -p codesigning "$keychain" | grep -F "$SESSIONS_SIGN_IDENTITY"
          printf '%s' "$SESSIONS_UPDATER_PRIVATE_KEY" > "$updater_key"
          export SESSIONS_UPDATER_KEY_PATH="$updater_key"
          if [[ -n "$APPLE_API_PRIVATE_KEY" ]]; then
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$api_key"
            export APPLE_API_KEY_PATH="$api_key"
          fi
          scripts/sign-release-assets.sh "$RUNNER_TEMP/unsigned" "$RUNNER_TEMP/app-stage" "$RUNNER_TEMP/cli-stage" "$RUNNER_TEMP/updater-tool" "$RUNNER_TEMP/signed" "$VERSION" "release/notes-v${VERSION}.md"
      - name: Remove any leftover credential files after interruption
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          python3 -c 'import pathlib,sys; [pathlib.Path(p).unlink(missing_ok=True) for p in sys.argv[1:]]' "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/updater.key" "$RUNNER_TEMP/notarization.p8"
      - name: Bind the verified signed artifacts
        id: inputs
        run: |
          digest="$(node scripts/release-artifacts.mjs record "$RUNNER_TEMP/signed" '${{ needs.build.outputs.version }}' '${{ needs.build.outputs.commit }}' signed)"
          printf 'manifest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload verified signed artifacts without publication authority
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-${{ needs.build.outputs.commit }}
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Prepare npm without signing or publication authority
    needs: [build, sign]
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.inputs.outputs.manifest }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the immutable packaging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Download exact verified signed assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact }}
          path: ${{ runner.temp }}/delivery
          merge-multiple: true
      - name: Verify signed assets and test the actual npm package
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          MANIFEST: ${{ needs.sign.outputs.manifest }}
        run: |
          node scripts/release-artifacts.mjs verify "$RUNNER_TEMP/delivery" "$VERSION" "$COMMIT" signed "$MANIFEST"
          cp -R npm "$RUNNER_TEMP/npm-package"
          node npm/scripts/prepare-release.cjs "$RUNNER_TEMP/delivery/cli" "$RUNNER_TEMP/npm-package"
          npm --prefix "$RUNNER_TEMP/npm-package" test
          npm pack "$RUNNER_TEMP/npm-package" --pack-destination "$RUNNER_TEMP/delivery"
          cp "$RUNNER_TEMP/npm-package/release-manifest.json" "$RUNNER_TEMP/delivery/npm-manifest.json"
          node npm/scripts/test-packed-release.cjs "$RUNNER_TEMP/delivery/somewhere-tech-sessions-${VERSION}.tgz" "$RUNNER_TEMP/delivery/npm-manifest.json" "$RUNNER_TEMP/delivery/cli"
          (cd "$RUNNER_TEMP/delivery" && shasum -a 256 "somewhere-tech-sessions-${VERSION}.tgz") > "$RUNNER_TEMP/delivery/somewhere-tech-sessions-${VERSION}.tgz.sha256"
          cat "$RUNNER_TEMP/delivery/somewhere-tech-sessions-${VERSION}.tgz.sha256" >> "$RUNNER_TEMP/delivery/checksums.txt"
      - name: Bind the complete delivery artifact
        id: inputs
        run: |
          digest="$(node scripts/release-artifacts.mjs record "$RUNNER_TEMP/delivery" '${{ needs.build.outputs.version }}' '${{ needs.build.outputs.commit }}' delivery)"
          printf 'manifest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload the exact delivery artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delivery-${{ needs.build.outputs.commit }}
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
          retention-days: 7

  linux_acceptance:
    name: Accept exact packaged Linux AMD64 runtime and npm CLI
    needs: [build, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the immutable acceptance helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}
      - name: Set up Node.js without dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Download only the producing delivery artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/delivery
          merge-multiple: true
      - name: Verify native host and complete provenance before execution
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.commit }}
          MANIFEST: ${{ needs.package.outputs.manifest }}
        run: |
          set -euo pipefail
          [[ "$(uname -s)/$(uname -m)" == Linux/x86_64 ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          node scripts/release-artifacts.mjs verify "$RUNNER_TEMP/delivery" "$VERSION" "$SOURCE_SHA" delivery "$MANIFEST"
      - name: Unpack the verified exact Linux archive with bounded member validation
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/unpack-release-cli.cjs "$RUNNER_TEMP/delivery/cli/sessions_${VERSION}_linux_amd64.tar.gz" "$RUNNER_TEMP/linux-runtime"
      - name: Exercise exact packaged runtime adoption and authentication
        env:
          SOURCE_SHA: ${{ needs.build.outputs.commit }}
        run: node scripts/linux-runtime-acceptance.mjs "$RUNNER_TEMP/linux-runtime" "$RUNNER_TEMP/linux-release-acceptance.json"
      - name: Exercise the exact prepared npm tarball offline
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: node npm/scripts/test-packed-release.cjs "$RUNNER_TEMP/delivery/somewhere-tech-sessions-${VERSION}.tgz" "$RUNNER_TEMP/delivery/npm-manifest.json" "$RUNNER_TEMP/delivery/cli" > "$RUNNER_TEMP/linux-npm-acceptance.log" 2>&1
      - name: Preserve isolated acceptance receipts and bounded diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release-acceptance-${{ needs.build.outputs.commit }}
          path: |
            ${{ runner.temp }}/linux-release-acceptance.json
            ${{ runner.temp }}/linux-release-acceptance.json.daemon.log
            ${{ runner.temp }}/linux-npm-acceptance.log
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Stage verified draft assets without signing keys or build tools
    needs: [build, package, linux_acceptance]
    runs-on: macos-14
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the immutable verification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}
      - name: Set up Node.js without dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Download the exact packaged delivery artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/delivery
          merge-multiple: true
      - name: Verify the complete artifact before draft-write authority is exposed
        run: node scripts/release-artifacts.mjs verify "$RUNNER_TEMP/delivery" '${{ needs.build.outputs.version }}' '${{ needs.build.outputs.commit }}' delivery '${{ needs.package.outputs.manifest }}'
      - name: Stage immutable GitHub assets in a draft only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [[ "$draft" == true ]] || { echo 'refusing to replace a published immutable release' >&2; exit 1; }
          else
            gh release create "$TAG" --draft --verify-tag --title "Sessions $VERSION" --notes-file "release/notes-v${VERSION}.md"
          fi
          assets=("$RUNNER_TEMP/delivery/Sessions.app.tar.gz" "$RUNNER_TEMP/delivery/Sessions.app.tar.gz.sig" "$RUNNER_TEMP/delivery/Sessions.app.tar.gz.sha256" "$RUNNER_TEMP/delivery/Sessions_${VERSION}_darwin_arm64.zip" "$RUNNER_TEMP/delivery/Sessions_${VERSION}_darwin_arm64.zip.sha256" "$RUNNER_TEMP/delivery/checksums.txt" "$RUNNER_TEMP/delivery/latest.json" "$RUNNER_TEMP/delivery/somewhere-tech-sessions-${VERSION}.tgz" "$RUNNER_TEMP/delivery/somewhere-tech-sessions-${VERSION}.tgz.sha256")
          for asset in "$RUNNER_TEMP/delivery"/cli/*; do assets+=("$asset"); done
          gh release upload "$TAG" "${assets[@]}"
      - name: Explain exact-byte acceptance and explicit promotion
        run: |
          {
            echo 'Verified artifacts are staged in a GitHub draft only. No public release, latest promotion, updater promotion, or npm publication has occurred.'
            echo 'Download the draft assets with an authorized GitHub identity and verify their checksums against this producing delivery artifact.'
            echo 'Install and test those exact signed bytes, recording native signing acceptance, compatible live-runner survival, and unreachable-baseline recovery or rollback.'
            echo 'Only after acceptance, explicitly authorize publication of the unchanged draft and verify the public runtime pins with npm/scripts/verify-release.cjs and the producing npm-manifest.json.'
            echo 'Publish the prepared npm tarball with a separately authorized npm identity; promote the hosted updater and download links separately after installation acceptance.'
            echo 'An existing draft asset is never overwritten automatically. Inspect any partial staging failure before manually changing draft assets, and repeat acceptance if their bytes change.'
          } >> "$GITHUB_STEP_SUMMARY"
