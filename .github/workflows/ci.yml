name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  GOFLAGS: -buildvcs=false

jobs:
  verify:
    name: Go, frontend, and native shell
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce the public source boundary
        run: scripts/check-public-tree.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            runtime/testdata/node-runtime/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, 2026-07-21
        with:
          toolchain: stable

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix runtime/testdata/node-runtime ci

      # `-timeout` is the difference between a test that fails and a test that
      # hangs. Without it every package inherits Go's 10-minute default, so one
      # blocked `<-channel` burns ten minutes, and two of them blow the 45-minute
      # job cap — at which point GitHub kills the job and prints no test output
      # at all. That has already happened here once. On timeout Go dumps every
      # goroutine's stack, which names the blocked receive; the cost of this flag
      # on a passing run is zero.
      - name: Verify Go runtime
        working-directory: runtime
        run: |
          go build ./...
          go vet ./...
          go test -timeout 5m ./...

      # The daemon is heavily concurrent: runners, watchers, the discovery loop,
      # and every attached client share session state. Ordinary `go test` cannot
      # see the data races that produces, so the detector runs as its own step.
      # The detector makes everything 2–10x slower, hence the larger bound.
      - name: Verify Go runtime under the race detector
        working-directory: runtime
        run: go test -race -timeout 15m ./...

      # A Windows-only compile break has shipped from this repo once, and was
      # caught by hand rather than by the gate: nothing on a pull request ever
      # builds for Windows. The full Windows job needs a windows-2022 runner and
      # bills at 2x; this cross-compile catches the same class of break on the
      # runner that is already running, in well under two minutes.
      #
      # It proves compilation and vet only — not behavior. The behavior contracts
      # still belong to the windows-2022 jobs.
      - name: Verify the Windows target still compiles and vets
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          export GOOS=windows GOARCH=amd64
          go build ./...
          # Test files are where GOOS-specific code most often rots unnoticed,
          # because `go build` never looks at them. `-run '^$'` compiles every
          # test binary and runs nothing.
          go test -run '^$' -count=1 ./...
          packages="$(go list ./... | grep -v -E '/internal/winconpty$')"
          go vet $packages
          # HPCON is a pointer-shaped Windows handle and the Win32 attribute API
          # wants its value as lpValue; that unavoidable conversion is isolated
          # to this package, matching windows-preview.yml.
          go vet -unsafeptr=false ./internal/winconpty

      - name: Verify generated CLI reference
        run: |
          bash runtime/scripts/gen-cli-docs.sh
          git diff --exit-code -- docs/CLI.md

      - name: Verify frontend
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend run build
          npm --prefix frontend run test:smoke

      - name: Verify native shell
        run: cargo test --manifest-path src-tauri/Cargo.toml
