name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_dev_app:
        description: Build an ad-hoc Apple Silicon app for local verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  GOFLAGS: -buildvcs=false

jobs:
  linux_amd64:
    name: Native Linux AMD64 runtime acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native host and source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(uname -s)/$(uname -m)" == Linux/x86_64 ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Build the three candidate runtime binaries
        working-directory: runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linux-runtime"
          for command in sessions sessionsd sessions-runner; do
            go build -o "$RUNNER_TEMP/linux-runtime/$command" "./cmd/$command"
          done
      - name: Exercise native runtime communication, adoption, and authentication
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/linux-runtime-acceptance.mjs "$RUNNER_TEMP/linux-runtime" "$RUNNER_TEMP/linux-acceptance.json"
      - name: Verify offline npm wrapper lifecycle fixtures on Linux
        run: npm --prefix npm test
      - name: Preserve the native acceptance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-amd64-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/linux-acceptance.json
          if-no-files-found: warn

  verify:
    name: Go, frontend, and native shell
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce the public source boundary
        run: scripts/check-public-tree.sh

      - name: Enforce bounded source modules
        run: scripts/check-source-size.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, 2026-07-21
        with:
          toolchain: stable

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      # `-timeout` is the difference between a test that fails and a test that
      # hangs. Without it every package inherits Go's 10-minute default, so one
      # blocked `<-channel` burns ten minutes, and two of them blow the 45-minute
      # job cap — at which point GitHub kills the job and prints no test output
      # at all. That has already happened here once. On timeout Go dumps every
      # goroutine's stack, which names the blocked receive; the cost of this flag
      # on a passing run is zero.
      - name: Verify Go runtime
        working-directory: runtime
        run: |
          go build ./...
          go vet ./...
          go test -timeout 5m ./...

      # The daemon is heavily concurrent: runners, watchers, the discovery loop,
      # and every attached client share session state. Ordinary `go test` cannot
      # see the data races that produces, so the detector runs as its own step.
      # The detector makes everything 2–10x slower, hence the larger bound.
      - name: Verify Go runtime under the race detector
        working-directory: runtime
        run: go test -race -timeout 15m ./...

      # A Windows-only compile break has shipped from this repo once, and was
      # caught by hand rather than by the gate: nothing on a pull request ever
      # builds for Windows. The full Windows job needs a windows-2022 runner and
      # bills at 2x; this cross-compile catches the same class of break on the
      # runner that is already running, in well under two minutes.
      #
      # It proves compilation and vet only — not behavior. The behavior contracts
      # still belong to the windows-2022 jobs.
      - name: Verify the Windows target still compiles and vets
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          export GOOS=windows GOARCH=amd64
          go build ./...
          # Test files are where GOOS-specific code rots unnoticed, because
          # `go build` never looks at them. `go test -c` cross-compiles and links
          # each test binary without running it — which is the only option here,
          # since a windows/amd64 .exe cannot execute on the macOS runner.
          for package in $(go list ./...); do
            go test -c -o /dev/null "$package"
          done
          # HPCON is a pointer-shaped Windows handle and the Win32 attribute API
          # wants its value as lpValue, so unsafeptr fires on that conversion.
          # It is isolated to internal/winconpty, but excluding that package from
          # the vet list does not silence it: vet reports a dependency's
          # diagnostic while checking an importer, so cmd/sessions-runner failed
          # too and this step was red. The relaxation therefore has to cover the
          # package and everything that imports it, computed rather than listed
          # so a new importer cannot quietly turn the step red again.
          relaxed="$(go list -f '{{.ImportPath}} {{join .Deps " "}}' ./... \
            | grep -E ' .*/internal/winconpty( |$)' | cut -d' ' -f1)"
          relaxed="$(printf '%s\n' "$relaxed" ./internal/winconpty | grep -v '^$' | sort -u)"
          strict="$(go list ./... | grep -v -F -x -f <(go list $relaxed))"
          go vet $strict
          go vet -unsafeptr=false $relaxed

      - name: Verify generated CLI reference
        run: |
          bash runtime/scripts/gen-cli-docs.sh
          git diff --exit-code -- docs/CLI.md

      # Split from one four-command step into four, so the GitHub UI names the
      # thing that failed instead of showing a red "Verify frontend" whose cause
      # is somewhere in a scrolled-off log.
      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Build frontend
        run: npm --prefix frontend run build

      # scripts/run-smoke.mjs runs the suites sequentially, bounds each one so a
      # hang fails instead of eating the job budget, and prints which suite and
      # which scenario failed. It also refuses to start if package.json declares
      # a `test:*` script that is in neither the gate nor its documented
      # exclusions — that is how a new smoke suite stays gated.
      - name: Verify frontend smoke suites
        run: npm --prefix frontend run test:smoke

      # These are the updater, release and Windows platform contracts. They ran
      # only in the Windows preview, which runs only on push to main -- so every
      # assertion in them, including the ones written specifically to stop a
      # Windows-only mistake reaching main, could not fire until after the merge
      # that introduced it. They are plain node tests over files in the tree,
      # they need no Windows runner, and they finish in well under a second.
      - name: Verify updater, release, and platform contracts
        run: npm run test:updater-release

      - name: Verify the packed npm installation lifecycle
        run: npm --prefix npm test

      # The native shell had no lint gate at all — `cargo test` compiles it and
      # nothing reads it. Clippy passes clean on this tree today, so `-D warnings`
      # can be enforced from the first run rather than kept as an aspiration.
      #
      # Cost: a full check pass over the dependency graph (576 crates). Measured
      # cold at 51 s wall / 2 m 38 s CPU on an 11-core arm64 box; expect roughly
      # 2–4 min on the 3-core macos-14 runner, which has no Rust cache. It runs
      # before `cargo test` so a lint failure costs a check pass, not a build.
      - name: Lint native shell
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Verify native shell
        run: cargo test --manifest-path src-tauri/Cargo.toml

  dev_app:
    name: Optional Apple Silicon development app
    needs: [verify, linux_amd64]
    if: github.event_name == 'workflow_dispatch' && inputs.build_dev_app == true && needs.verify.result == 'success' && needs.linux_amd64.result == 'success'
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SESSIONS_RUNTIME_SIGN_MODE: adhoc
      SESSIONS_RUNTIME_DEVELOPMENT: "1"

    steps:
      - name: Check out the immutable verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source and native architecture
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(uname -s)/$(uname -m)" == Darwin/arm64 ]] || { echo 'Apple Silicon macOS host required' >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, 2026-07-21
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build and record the development bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain=v1)" ]] || { echo 'Source changed before build' >&2; exit 1; }
          npm exec tauri build -- --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'
          app=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sessions.app
          output="$RUNNER_TEMP/development-app"
          mkdir "$output"
          archive="$output/Sessions-development-$SOURCE_SHA-darwin-arm64.zip"
          ditto -c -k --norsrc --noextattr --noqtn --noacl --keepParent "$app" "$archive"
          version="$(node -p "require('./package.json').version")"
          node scripts/development-app-manifest.mjs record "$app" "$archive" "$output/development-app.json" "$SOURCE_SHA" "$WORKFLOW_RUN_ID" "$WORKFLOW_RUN_ATTEMPT" "$version"
          node scripts/development-app-manifest.mjs verify "$app" "$archive" "$output/development-app.json" "$SOURCE_SHA" "$WORKFLOW_RUN_ID" "$WORKFLOW_RUN_ATTEMPT" "$version"
          (cd "$output" && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")

      - name: Save the development bundle for local verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sessions-development-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-darwin-arm64
          path: ${{ runner.temp }}/development-app/*
          if-no-files-found: error
          retention-days: 7
